<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог моделей — Corepolis</title>
<link rel="icon" href="./assets/images/favicon-32x32.png"><link rel="stylesheet" href="./model-catalog.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head>
<body><header><div><a href="./">← Corepolis</a><h1>Выбираем здания</h1><p>Quaternius · Ultimate Fantasy RTS · Нажми на модель, чтобы рассмотреть и назначить её постройке.</p></div><button id="copy" type="button">Скопировать выбор</button></header>
<main><section class="filters" aria-label="Фильтры"><input id="search" type="search" placeholder="Название файла…" aria-label="Поиск модели"><select id="family" aria-label="Тип модели"><option value="">Все типы</option></select><select id="age" aria-label="Эпоха"><option value="">Все эпохи</option><option value="FirstAge">Первая эпоха</option><option value="SecondAge">Вторая эпоха</option></select><select id="level" aria-label="Уровень"><option value="">Все уровни</option><option value="Level1">Уровень 1</option><option value="Level2">Уровень 2</option><option value="Level3">Уровень 3</option></select></section>
<p id="count" role="status"></p><section id="selection" aria-label="Выбранные модели"></section><textarea id="export" aria-label="Список выбранных моделей" readonly hidden></textarea><section id="grid" aria-label="Каталог моделей"></section></main>
<dialog id="viewer"><div class="viewer-head"><h2 id="model-name"></h2><button id="close" aria-label="Закрыть просмотр">✕</button></div><div id="stage"></div><p id="status" role="status"></p><p>Вращение — зажать мышь · Масштаб — колесо · На телефоне — жесты</p><div class="assign"><select id="role" aria-label="Назначение модели"><option value="house">Дом</option><option value="windmill">Мельница</option><option value="market">Рынок</option><option value="quarry">Карьер</option><option value="lumbermill">Лесопилка</option><option value="farm">Поле</option><option value="pier">Причал</option><option value="fishingShop">Рыбная лавка</option><option value="lighthouse">Маяк</option><option value="other">Другая постройка</option></select><button id="assign">Выбрать модель</button><button id="reset">Вернуть ракурс</button></div></dialog>
<script type="module" src="./src/model-catalog.js?v=2"></script></body></html>
